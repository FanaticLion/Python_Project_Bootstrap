<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>{{ title }}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      display: flex;
    }
    .sidebar {
      width: 220px;
      height: 100vh;
      background-color: #212529;
      color: white;
      position: fixed;
    }
    .sidebar .nav-link {
      color: #adb5bd;
    }
    .sidebar .nav-link.active {
      background-color: #0d6efd;
      color: white;
    }
    .content {
      margin-left: 220px;
      padding: 20px;
      width: 100%;
    }
  </style>
</head>
<body>
  <!-- Боковое меню -->
  <div class="sidebar p-3">
    <h4 class="text-white">Меню</h4>
    <ul class="nav flex-column">
      <li class="nav-item"><a class="nav-link {{ page=='index' and 'active' or '' }}" href="index.html">Главная</a></li>
      <li class="nav-item"><a class="nav-link {{ page=='catalog' and 'active' or '' }}" href="catalog.html">Каталог</a></li>
      <li class="nav-item"><a class="nav-link {{ page=='category' and 'active' or '' }}" href="category.html">Категории</a></li>
      <li class="nav-item"><a class="nav-link {{ page=='contacts' and 'active' or '' }}" href="contacts.html">Контакты</a></li>
    </ul>
  </div>

  <!-- Основной контент -->
  <div class="content">
    {{ content }}
  </div>
</body>
</html>
